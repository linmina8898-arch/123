<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>機場接送｜自助報價預約系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --brand: #A20055;
      --brand-dark: #7A0030;
      --text-main: #333333;
      --text-muted: #666666;
      --bg-light: #F8F9FA;
      --border-color: #EEEEEE;
      --accent-soft: #F9E6EE;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: #FFFFFF; color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5;
    }
    .page { max-width: 600px; margin: 0 auto; padding-bottom: 60px; }
    .header { padding: 40px 24px; background: #FFFFFF; border-bottom: 4px solid var(--brand); }
    .header .badge { display: inline-block; font-size: 13px; font-weight: 700; color: var(--brand); margin-bottom: 8px; letter-spacing: 1px; }
    .header h1 { font-size: 24px; font-weight: 800; color: var(--brand); margin-bottom: 12px; }
    .header p { font-size: 14px; color: var(--text-muted); font-weight: 500; }
    .steps-wrapper { padding: 0 20px; margin-top: 24px; }
    .steps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .step { padding: 10px; font-size: 12px; font-weight: 700; text-align: center; border-bottom: 2px solid var(--border-color); color: #BBB; }
    .step.active { color: var(--brand); border-bottom-color: var(--brand); }
    .section-card { margin: 24px 20px 0; }
    .section-title { font-size: 16px; font-weight: 800; margin-bottom: 20px; padding-left: 12px; border-left: 4px solid var(--brand); }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
    .input, .select, .textarea { width: 100%; height: 48px; border: 1px solid #DDD; border-radius: 4px; background: #FFF; padding: 0 12px; font-size: 15px; outline: none; transition: 0.2s; }
    .input:focus, .select:focus { border-color: var(--brand); }
    .textarea { height: 100px; padding: 12px; resize: none; }
    .segmented { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--brand); border-radius: 4px; overflow: hidden; }
    .segmented button { height: 42px; background: #FFF; color: var(--brand); font-weight: 700; border: none; }
    .segmented button.active { background: var(--brand); color: #FFF; }
    .price-panel { margin-top: 30px; padding: 24px; background: var(--bg-light); border-radius: 8px; text-align: center; }
    .price-amount { font-size: 32px; font-weight: 900; color: var(--brand); }
    .primary-btn { width: 100%; height: 52px; background: var(--brand); color: #FFF; border: none; border-radius: 4px; font-size: 16px; font-weight: 700; margin-top: 20px; }
    .primary-btn:disabled { background: #CCC; }
    .secondary-btn { width: 100%; height: 52px; background: #FFF; color: var(--brand); border: 1px solid var(--brand); border-radius: 4px; font-size: 16px; font-weight: 700; margin-top: 12px; }
    .summary-box { background: var(--accent-soft); border-radius: 4px; padding: 16px; font-size: 14px; color: var(--brand-dark); font-weight: 600; line-height: 1.8; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hidden { display: none !important; }
    @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } .grid-2.mobile-row { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="badge">合法租賃車｜拒絕白牌｜價格透明｜安全有保障</div>
      <h1>📢 自助下單最快速！</h1>
      <p>歡迎直接使用系統試算詢價，報價準確度達 9 成以上，價格透明不變動。</p>
    </header>

    <div class="steps-wrapper">
      <div class="steps">
        <div id="stepQuote" class="step active">Step 1. 試算報價</div>
        <div id="stepBooking" class="step">Step 2. 填寫資料</div>
        <div id="stepDone" class="step">Step 3. 預約完成</div>
      </div>
    </div>

    <form id="bookingForm" onsubmit="return false;">
      <input type="hidden" id="bookingId" />
      <input type="hidden" id="bookingType" value="送機" />

      <section id="quoteSection" class="section-card">
        <h2 class="section-title">行程條件</h2>
        <div class="field">
          <label>接送類型</label>
          <div class="segmented" id="bookingTypeSeg">
            <button type="button" class="active" data-value="送機">送機</button>
            <button type="button" data-value="接機">接機</button>
            <button type="button" data-value="回來">來回</button>
          </div>
        </div>
        <div class="grid-2">
          <div class="field"><label>縣市</label><select id="county" class="select" required><option value="">載入中...</option></select></div>
          <div class="field"><label>區域</label><select id="zipCode" class="select" required disabled><option value="">請先選縣市</option></select></div>
        </div>
        <div class="field">
          <label>車型</label>
          <select id="vehicleType" class="select" required>
            <option value="" disabled selected>請選擇車型</option>
            <option value="小車">小車｜2人2件</option>
            <option value="休旅車">休旅車｜4人3件</option>
            <option value="大車">大車｜6人6件</option>
          </select>
        </div>
        <div class="grid-2 mobile-row">
          <div class="field"><label>乘車日期</label><input type="date" id="rideDate" class="input" required /></div>
          <div class="field">
            <label>時間</label>
            <div class="flex gap-1"><select id="rideHour" class="select" required></select><select id="rideMinute" class="select" required></select></div>
          </div>
        </div>
        <div id="returnDateSection" class="hidden">
          <div class="grid-2 mobile-row">
            <div class="field"><label>回程日期</label><input type="date" id="returnDate" class="input" /></div>
            <div class="field"><label>回程時間</label><div class="flex gap-1"><select id="returnHour" class="select"></select><select id="returnMinute" class="select"></select></div></div>
          </div>
        </div>
        <div class="grid-2 mobile-row">
          <div class="field"><label>安全座椅 (+$200)</label><select id="infantCount" class="select"><option value="0">不需要</option><option value="1">1 張</option><option value="2">2 張</option></select></div>
          <div class="field flex items-center pt-6"><label class="flex items-center cursor-pointer"><input type="checkbox" id="extraSign" class="w-4 h-4 mr-2 accent-[#A20055]"><span class="text-sm font-bold">需要舉牌 (+$200)</span></label></div>
        </div>
        <div class="price-panel">
          <div class="price-label">系統試算總金額</div>
          <div id="priceDisplay" class="price-amount">NT$ --</div>
          <div id="priceSub" class="text-xs text-gray-500">請完成上方選項</div>
          <input type="hidden" id="estimatedPrice" />
        </div>
        <button type="button" id="goBookingBtn" class="primary-btn" disabled>滿意價格，下一步填寫資料</button>
      </section>

      <section id="bookingSection" class="section-card hidden">
        <h2 class="section-title">聯絡人資料</h2>
        <div class="summary-box mb-4" id="quoteSummary"></div>
        <div class="field"><label>LINE ID</label><input type="text" id="lineId" class="input" required /></div>
        <div class="grid-2 mobile-row">
          <div class="field"><label>姓名</label><input type="text" id="passengerName" class="input" required /></div>
          <div class="field"><label>稱謂</label><select id="passengerTitle" class="select"><option>先生</option><option>小姐</option></select></div>
        </div>
        <div class="field"><label>手機號碼</label><input type="tel" id="passengerPhone" class="input" required /></div>
        <div class="field"><label>詳細接送地址</label><input type="text" id="address" class="input" required /></div>
        <div class="grid-2 mobile-row">
          <div class="field"><label>航班編號</label><input type="text" id="flightNumber" class="input" required /></div>
          <div class="field"><label>付款方式</label><select id="paymentMethod" class="select"><option>現金 / 轉帳</option><option>街口 / 全支付</option></select></div>
        </div>
        <div id="returnFlightSection" class="hidden field"><label>回程航班</label><input type="text" id="returnFlightNumber" class="input" /></div>
        <div class="field"><label>備註需求</label><textarea id="remarks" class="textarea"></textarea></div>
        <button type="button" id="submitBtn" class="primary-btn">確認預約</button>
        <button type="button" id="backQuoteBtn" class="secondary-btn">返回修改</button>
      </section>

      <section id="doneSection" class="section-card hidden">
        <div class="text-center py-10"><div class="text-6xl mb-4" style="color: var(--brand)">✓</div><h2 class="text-2xl font-black mb-2">預約成功</h2><div class="summary-box my-6" id="doneSummary"></div><p class="text-gray-500 text-sm">客服將儘速透過 LINE 與您確認。</p></div>
      </section>
    </form>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz0K_NwnZIzzksur4pqb3X4fHTOO4i0s32-8UDylYVXtQhnRsJruIkYRni962I68icY/exec";
    const LIFF_ID = "2009792282-I5YaiFVf";
    let countyMap = {}; let specialDates = []; let isCalculating = false;

    document.addEventListener("DOMContentLoaded", async () => {
      initTimeSelectors(); initBookingId(); await fetchSettings(); liff.init({ liffId: LIFF_ID }); bindEvents();
    });

    async function fetchSettings() {
      try {
        const res = await fetch(`${GAS_URL}?action=getSettings&t=${Date.now()}`);
        const data = await res.json();
        if(data.status === "success") {
          specialDates = data.specialDates;
          data.zips.forEach(str => {
            const parts = str.split(' ');
            const county = parts[1].substring(0,3).replace(/台/g,'臺');
            if(!countyMap[county]) countyMap[county] = [];
            countyMap[county].push({ zip: parts[0], region: parts[1].substring(3), full: str });
          });
          const countySelect = document.getElementById("county");
          countySelect.innerHTML = '<option value="" disabled selected>請選擇縣市</option>' + Object.keys(countyMap).sort().map(c => `<option value="${c}">${c}</option>`).join("");
        }
      } catch(e) { document.getElementById("county").innerHTML = '<option value="">載入失敗</option>'; }
    }

    function bindEvents() {
      document.getElementById("county").onchange = function() {
        const zipSelect = document.getElementById("zipCode"); zipSelect.disabled = false;
        zipSelect.innerHTML = '<option value="" disabled selected>區域</option>' + countyMap[this.value].map(r => `<option value="${r.full}">${r.zip} ${r.region}</option>`).join("");
        calculate();
      };
      document.querySelectorAll("#bookingTypeSeg button").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#bookingTypeSeg button").forEach(b => b.classList.remove("active")); btn.classList.add("active");
          document.getElementById("bookingType").value = btn.dataset.value;
          const isRound = btn.dataset.value === "回來";
          document.getElementById("returnDateSection").classList.toggle("hidden", !isRound);
          document.getElementById("returnFlightSection").classList.toggle("hidden", !isRound);
          calculate();
        };
      });
      ["zipCode","vehicleType","rideDate","rideHour","rideMinute","returnDate","returnHour","returnMinute","infantCount","extraSign"].forEach(id => {
        document.getElementById(id).onchange = calculate;
      });
      document.getElementById("goBookingBtn").onclick = () => { setStep(2); updateSummary(); };
      document.getElementById("backQuoteBtn").onclick = () => setStep(1);
      document.getElementById("submitBtn").onclick = submit;
    }

    async function calculate() {
      const zip = document.getElementById("zipCode").value; const veh = document.getElementById("vehicleType").value;
      const date = document.getElementById("rideDate").value; const hour = document.getElementById("rideHour").value;
      const type = document.getElementById("bookingType").value;
      if(!zip || !veh || !date || !hour) return;
      if(isCalculating) return; isCalculating = true;
      document.getElementById("priceDisplay").innerText = "試算中...";
      try {
        const res = await fetch(`${GAS_URL}?action=getPrice&zipCode=${encodeURIComponent(zip)}&vehicleType=${encodeURIComponent(veh)}`);
        const result = await res.json();
        if(result.status === "success") {
          let base = parseInt(result.price); let extra = 0; let r = [];
          if(type === "接機") { extra += 200; r.push("接機+200"); }
          if(parseInt(hour) >= 22 || parseInt(hour) <= 5) { extra += 200; r.push("夜間+200"); }
          const sd = specialDates.find(d => d.date === date);
          if(sd) { extra += parseInt(sd.surcharge); r.push(`${sd.reason}+${sd.surcharge}`); }
          const infants = parseInt(document.getElementById("infantCount").value);
          if(infants > 0) { extra += infants * 200; r.push(`座椅+${infants*200}`); }
          if(document.getElementById("extraSign").checked) { extra += 200; r.push("舉牌+200"); }
          let total = (type === "回來") ? (base * 2) + extra : base + extra;
          document.getElementById("priceDisplay").innerText = `NT$ ${total.toLocaleString()}`;
          document.getElementById("estimatedPrice").value = `NT$ ${total.toLocaleString()}`;
          document.getElementById("priceSub").innerText = (type === "回來" ? "【來回雙趟】" : "") + (r.length ? `含：${r.join("、")}` : "基礎報價");
          document.getElementById("goBookingBtn").disabled = false;
        }
      } finally { isCalculating = false; }
    }

    async function submit() {
      const btn = document.getElementById("submitBtn"); btn.disabled = true; btn.innerText = "傳送中...";
      const payload = {
        action: "submitBooking", bookingId: document.getElementById("bookingId").value,
        passengerName: document.getElementById("passengerName").value + " " + document.getElementById("passengerTitle").value,
        passengerPhone: document.getElementById("passengerPhone").value, address: document.getElementById("zipCode").value + " " + document.getElementById("address").value,
        rideDate: document.getElementById("rideDate").value, rideTime: document.getElementById("rideHour").value + ":" + document.getElementById("rideMinute").value,
        bookingType: document.getElementById("bookingType").value, flightNumber: document.getElementById("flightNumber").value,
        vehicleType: document.getElementById("vehicleType").value, estimatedPrice: document.getElementById("estimatedPrice").value,
        remarks: document.getElementById("remarks").value, payment: document.getElementById("paymentMethod").value,
        returnDate: document.getElementById("returnDate").value || "", returnTime: document.getElementById("returnHour").value ? (document.getElementById("returnHour").value + ":" + document.getElementById("returnMinute").value) : "",
        returnFlight: document.getElementById("returnFlightNumber").value || "", lineId: document.getElementById("lineId").value || "N/A"
      };
      try {
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        const resData = await res.json();
        if(resData.status === "success") {
          setStep(3); document.getElementById("doneSummary").innerHTML = `單號：${payload.bookingId}<br>金額：${payload.estimatedPrice}`;
          if(liff.isInClient()) liff.sendMessages([{ type: 'text', text: `【預約成功】\n單號：${payload.bookingId}\n時間：${payload.rideDate} ${payload.rideTime}\n金額：${payload.estimatedPrice}` }]);
        }
      } catch(e) { btn.disabled = false; btn.innerText = "確認預約"; }
    }

    function initTimeSelectors() {
      let h = '<option value="" disabled selected>時</option>'; for(let i=0;i<24;i++) h+=`<option value="${i.toString().padStart(2,'0')}">${i.toString().padStart(2,'0')}</option>`;
      let m = '<option value="" disabled selected>分</option>'; for(let i=0;i<60;i+=5) m+=`<option value="${i.toString().padStart(2,'0')}">${i.toString().padStart(2,'0')}</option>`;
      ["rideHour","returnHour"].forEach(id => document.getElementById(id).innerHTML = h); ["rideMinute","returnMinute"].forEach(id => document.getElementById(id).innerHTML = m);
    }
    function initBookingId() { document.getElementById("bookingId").value = "ANS" + new Date().getTime().toString().slice(-8); }
    function setStep(s) {
      document.querySelectorAll(".step").forEach(el => el.classList.remove("active"));
      document.getElementById("quoteSection").classList.add("hidden"); document.getElementById("bookingSection").classList.add("hidden"); document.getElementById("doneSection").classList.add("hidden");
      if(s===1) { document.getElementById("stepQuote").classList.add("active"); document.getElementById("quoteSection").classList.remove("hidden"); }
      if(s===2) { document.getElementById("stepBooking").classList.add("active"); document.getElementById("bookingSection").classList.remove("hidden"); }
      if(s===3) { document.getElementById("stepDone").classList.add("active"); document.getElementById("doneSection").classList.remove("hidden"); }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function updateSummary() {
      document.getElementById("quoteSummary").innerHTML = `行程：${document.getElementById("bookingType").value} ｜ 地區：${document.getElementById("zipCode").value}<br>預估金額：<span style="color: var(--brand)">${document.getElementById("estimatedPrice").value}</span>`;
    }
  </script>
</body>
</html>
